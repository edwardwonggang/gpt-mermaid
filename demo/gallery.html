<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mermaid-rounded · 渲染画廊</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--line:#e6e8ec;--ink:#1c1f23;--ink2:#5a626e;--ink3:#8b939f;
    --accent:#2f6df6;--code:#f3f4f7}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 24px 64px;background:var(--bg);color:var(--ink);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto}
  h1{font-size:20px;font-weight:650;margin:0 0 4px}
  .sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  .bar span{font-size:12px;color:var(--ink3);margin-right:4px}
  .bar button{border:1px solid var(--line);background:#fff;color:#3b4657;border-radius:8px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.15s}
  .bar button:hover{border-color:#c7d0dd}
  .bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  @media (max-width:1000px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card.dark{background:#1a1b26;border-color:#2a2f45}
  .hd{display:flex;align-items:baseline;gap:9px;padding:13px 17px 10px;border-bottom:1px solid var(--line)}
  .card.dark .hd{border-color:#2a2f45}
  .hd h2{font-size:13.5px;font-weight:640;margin:0}
  .card.dark .hd h2{color:#c0caf5}
  .hd .tag{font-size:11px;font-weight:650;letter-spacing:.4px;color:#fff;background:var(--accent);border-radius:5px;padding:2px 7px}
  .hd .note{margin-left:auto;font:11px/1 ui-monospace,Menlo,monospace;color:var(--ink3)}
  .cv{padding:16px 14px;display:flex;justify-content:center;align-items:center;min-height:150px;overflow:auto}
  .cv svg{max-width:100%;height:auto}
  details{border-top:1px solid var(--line)}
  .card.dark details{border-color:#2a2f45}
  summary{cursor:pointer;padding:8px 17px;font:11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--ink3);outline:none;user-select:none}
  pre{margin:0;padding:10px 17px 14px;background:var(--code);font:11.5px/1.65 ui-monospace,Menlo,monospace;color:#33383f;overflow:auto;white-space:pre}
  .wide{grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <h1>mermaid-rounded 渲染画廊</h1>
  <div class="sub">判定框=圆角矩形 · 方框宽度随文字 · 子图容器圆角 · 多套配色（<code>demo/gallery.html</code>）</div>
  <div class="bar" id="bar"><span>配色</span></div>
  <div class="grid" id="grid"></div>
</div>

<script src="../dist/mermaid.rounded.min.js"></script>
<script src="../dist/mermaid-rounded.arrows.js"></script>
<script src="../dist/mermaid-rounded.themes.js"></script>
<script>
const CASES = [
  { id:'basic', tag:'基本', title:'三步直线', note:'宽度随文字',
    code:`flowchart TD
    A[提交申请] --> B[资料初审] --> C[归档]` },
  { id:'branch', tag:'判定', title:'判定 + 双分支', note:'不再是菱形',
    code:`flowchart TD
    A[收到申请] --> B{资料齐全}
    B -->|是| C[进入审批]
    B -->|否| D[退回补充]` },
  { id:'long', tag:'判定', title:'长条件判定', note:'自动折行',
    code:`flowchart TD
    A[提交] --> B{申请资料是否齐全且签章有效金额未超限且客户不在风险名单内}
    B -->|是| C[通过]
    B -->|否| D[退回]` },
  { id:'multi', tag:'判定', title:'多级判定串联', note:'纵向更紧凑', wide:true,
    code:`flowchart TD
    A[发起] --> B{金额超限}
    B -->|是| C{需要副总审批}
    C -->|是| D{涉及合规}
    D -->|是| E[合规复核]
    D -->|否| F[副总签批]
    C -->|否| G[财务复核]
    B -->|否| H[系统自动通过]
    E --> I[归档]
    F --> I
    G --> I
    H --> I` },
  { id:'sub', tag:'子图', title:'子图分成', note:'容器也圆角了',
    code:`flowchart TD
    A[提交] --> B{是否需要复核}
    B -->|是| S1
    subgraph S1[复核流程]
      direction TB
      C1[初审] --> C2[复核] --> C3[签发]
    end
    B -->|否| D[直接通过]
    S1 --> E[归档]
    D --> E` },
  { id:'lr', tag:'方向', title:'横向 LR', note:'长链横铺',
    code:`flowchart LR
    A[接收工单] --> B{是否紧急}
    B -->|是| C[立即分派]
    B -->|否| D[进入队列]
    C --> E[处理中]
    D --> E
    E --> F[完成归档]` },
  { id:'edge', tag:'边标签', title:'长边标签折行', note:'判定说短话',
    code:`flowchart TD
    A[提交] --> B{能否通过}
    B -->|资料齐全且签章有效<br/>金额未超限<br/>且不在风险名单| C[通过]
    B -->|以上任一不满足| D[退回]` },
  { id:'state', tag:'状态图', title:'状态图', note:'文字居中 + 圆角',
    code:`stateDiagram-v2
    [*] --> 待提交
    待提交 --> 审核中: 提交
    审核中 --> 已通过: 通过
    审核中 --> 已驳回: 驳回
    已驳回 --> 待提交: 修改
    已通过 --> [*]` },
  { id:'shapes', tag:'形状', title:'形状展示', note:'矩形族圆角',
    code:`flowchart LR
    R[矩形] --> RD(圆角)
    RD --> ST([体育场形])
    ST --> CY[(数据库)]
    CY --> CIR((圆形))` }
];

const grid = document.getElementById('grid');
const bar = document.getElementById('bar');
let themeName = 'linear';

CASES.forEach(function (c) {
  const card = document.createElement('section');
  card.className = 'card' + (c.wide ? ' wide' : '');
  card.innerHTML = `<div class="hd"><span class="tag">${c.tag}</span><h2>${c.title}</h2>
      <span class="note">${c.note}</span></div>
    <div class="cv" id="cv-${c.id}"></div>
    <details><summary>查看源码</summary><pre></pre></details>`;
  card.querySelector('pre').textContent = c.code;
  grid.appendChild(card);
});

async function renderAll() {
  const cfg = MermaidRounded.config(themeName);
  mermaid.initialize(Object.assign({ startOnLoad: false }, cfg));
  const dark = MermaidRounded.isDark();
  document.querySelectorAll('.card').forEach(function (el) {
    el.classList.toggle('dark', dark);
  });
  for (const c of CASES) {
    const host = document.getElementById('cv-' + c.id);
    try {
      const { svg } = await mermaid.render('g-' + c.id + '-' + themeName, c.code);
      host.innerHTML = svg;
    } catch (e) {
      host.innerHTML = '<div style="color:#b42318;font:12px monospace">渲染失败：' + e.message + '</div>';
    }
  }
  window.__done = true;
}

Object.keys(MermaidRounded.themes).forEach(function (key) {
  const btn = document.createElement('button');
  btn.textContent = MermaidRounded.themes[key].label;
  btn.dataset.theme = key;
  btn.onclick = function () {
    themeName = key;
    MermaidRounded.useTheme(key);
    document.querySelectorAll('.bar button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.theme === key);
    });
    renderAll();
  };
  if (key === themeName) btn.classList.add('on');
  bar.appendChild(btn);
});

MermaidRounded.useTheme(themeName);
renderAll();
</script>
</body>
</html>
