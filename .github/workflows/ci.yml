name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  unit-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed dist matches source
        run: git diff --exit-code -- dist
      - run: npm run check
      - name: Verify pinned Mermaid runtime
        run: node scripts/verify-runtime-integrity.mjs
      - name: Verify every test file is registered in CI
        run: node scripts/verify-ci-coverage.mjs
      - name: Run unit and API package scripts
        run: |
          npm test
          npm run test:api
          npm run test:api-types
      - name: Run node:test files outside the *.test.mjs glob
        run: node scripts/run-extra-node-tests.mjs

  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed dist matches source
        run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium E2E
        run: npm run test:e2e

  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed dist matches source
        run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps webkit
      - name: Run WebKit mobile viewport regression
        run: node test/webkit-mobile.mjs

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed dist matches source
        run: git diff --exit-code -- dist
      - name: Verify npm pack contents and installed entrypoints
        run: node scripts/verify-package.mjs
